<title>QTS 台股交易系統</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .card { display: block; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; text-decoration: none; color: inherit; transition: border-color .15s; }
  .card:hover { border-color: #388bfd; }
  .card-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .card-desc { font-size: 13px; color: #8b949e; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-bottom: 10px; }
  .badge-scan { background: #1a3a1a; color: #3fb950; border: 1px solid #238636; }
  .badge-monitor { background: #1a2d3d; color: #79c0ff; border: 1px solid #388bfd; }
