const _PLAN_ROWS = [["entry","📥 進場依據","pos"],["stop","🛑 停損","neg"],["targets","🎯 目標/停利","pos"],
  ["add","➕ 加碼","pos"],["trim","➖ 減碼","flat"],["abort","⚠ 中止","neg"],
  ["timeframe","⏳ 持有","flat"],["risk","🔺 風險","neg"]];
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cls = v => v>0?"pos":(v<0?"neg":"flat");
const dates = Object.keys(HISTORY).sort();
let selDate = dates.length ? dates[dates.length-1] : null;
let viewYM = selDate ? selDate.slice(0,7) : null;

function renderPlan(key){
  const p = PLANS[key];
  if(!p) return '<div class="noplan">（此筆無 AI 交易計畫：手動單或早於計畫機制）</div>';
  let rows = "";
  for(const [k,label,c] of _PLAN_ROWS){
    let v = p[k]; if(!v) continue;
    let vh = Array.isArray(v) ? "<ul>"+v.filter(Boolean).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>" : esc(v);
    rows += '<div class="prow"><span class="pk '+c+'">'+label+'</span><span>'+vh+'</span></div>';
  }
  const sum = p.summary ? '<div class="plan-sum">'+esc(p.summary)+'</div>' : "";
  return '<div class="plan"><div class="plan-h">🤖 AI 交易計畫</div>'+sum+rows+'</div>';
}

function posCard(o){
  const pnl = o.pnlPct, hasPnl = pnl!=null;
  const pnlHtml = hasPnl
    ? '<div class="pnl-box"><div class="pnl-pct '+cls(pnl)+'">'+(pnl>0?"+":"")+pnl.toFixed(2)+'%</div>'
      + '<div class="meta">'+(o.pnlAmt!=null?(o.pnlAmt>0?"+":"")+"$"+o.pnlAmt.toLocaleString():"")+'</div></div>'
    : '<div class="pnl-box meta">無報價</div>';
  let tags = o.isNew ? '<span class="tag new">今日新進</span>' : '<span class="tag hold">持倉第 '+o.daysHeld+' 天</span>';
  if(o.highConviction) tags += '<span class="tag hi">重壓</span>';
  if(o.exploration) tags += '<span class="tag exp">探索</span>';
  return '<div class="card'+(o.isNew?' new':'')+'">'
    + '<div class="card-top"><div><div class="title"><span class="code">'+esc(o.code)+'</span> '+esc(o.name)+' '+tags+'</div>'
    + '<div class="meta">'+esc(o.entryDate)+' 進場 @ '+esc(o.entryPrice)+' ｜ 停損 '+esc(o.stopPrice)
    + ' ｜ 現價 '+esc(o.currentPrice)+' ｜ '+esc(o.shares)+' 股</div></div>'
    + pnlHtml + '</div>'
    + (o.strategy?'<div class="strat">策略：<b>'+esc(o.strategy)+'</b></div>':'')
    + renderPlan(o.planKey) + '</div>';
}

function closedCard(c){
  const r = {stop_profit:"🎯 停利",stop_loss:"🛑 停損",manual:"✋ 手動"}[c.reason]||esc(c.reason);
  return '<div class="card"><div class="card-top"><div class="title"><span class="code">'+esc(c.code)+'</span> '+esc(c.name)
    +'</div><div class="pnl-box"><div class="pnl-pct '+cls(c.pnlPct)+'">'+(c.pnlPct>0?"+":"")+(c.pnlPct!=null?c.pnlPct.toFixed(2):"-")+'%</div>'
    +'<div class="meta">'+(c.rMultiple!=null?(c.rMultiple>0?"+":"")+c.rMultiple.toFixed(2)+"R":"")+'</div></div></div>'
    +'<div class="meta">'+r+' 出場 @ '+esc(c.exitPrice)+' ｜ 持有 '+esc(c.daysHeld)+' 天</div>'
    + renderPlan(c.planKey) +'</div>';
}

const fmtAmt = v => (v>0?"+":"")+"$"+Math.round(v).toLocaleString();
function renderDay(){
  const snap = HISTORY[selDate];
  const el = document.getElementById("dayPanel");
  if(!snap){ el.innerHTML = '<div class="empty">這天沒有資料</div>'; return; }
  const ps = snap.positions||[], cl = snap.closed||[];
  const ai = ps.filter(p=>p.auto), mine = ps.filter(p=>!p.auto);
  const sum = arr => arr.reduce((s,p)=>s+(p.pnlAmt||0),0);
  const aiPnl = sum(ai), minePnl = sum(mine);
  const nNew = ai.filter(p=>p.isNew).length;
  const sortf = (a,b)=> (b.isNew-a.isNew) || ((b.pnlPct||-999)-(a.pnlPct||-999));
  let html = '<div class="day-head">📅 '+selDate+'</div>'
    + '<div class="day-stat">'
    + '<span>🤖 AI 持倉 <b>'+ai.length+'</b>（今日新進 <b class="pos">'+nNew+'</b>）　未實現 <b class="'+cls(aiPnl)+'">'+fmtAmt(aiPnl)+'</b></span>'
    + '<span>👤 我的持倉 <b>'+mine.length+'</b>　未實現 <b class="'+cls(minePnl)+'">'+fmtAmt(minePnl)+'</b></span>'
    + (cl.length?'<span>當日平倉 <b>'+cl.length+'</b></span>':'')+'</div>';
  html += '<div class="sec-h">🤖 AI 自動交易</div>';
  html += ai.length ? ai.slice().sort(sortf).map(posCard).join("") : '<div class="empty">（今日無 AI 持倉）</div>';
  html += '<div class="sec-h">👤 我的持倉（手動）</div>';
  html += mine.length ? mine.slice().sort(sortf).map(posCard).join("") : '<div class="empty">（無手動持倉）</div>';
  if(cl.length){ html += '<div class="sec-h">📂 當日平倉</div>' + cl.map(closedCard).join(""); }
  el.innerHTML = html;
}

    const snap = HISTORY[ds];
    let cls2 = "cal-cell", dot = "";
    if(snap){ cls2 += " has"; if(ds===selDate) cls2 += " sel";
      // 日曆點以 AI 持倉當日未實現損益著色（本日誌聚焦 AI 交易）
      const tp = (snap.positions||[]).filter(p=>p.auto).reduce((s,p)=>s+(p.pnlAmt||0),0);
      dot = '<span class="dot" style="background:'+(tp>=0?"#3fb950":"#f85149")+'"></span>';
    }
    g += '<div class="'+cls2+'" '+(snap?'onclick="selectDay(\''+ds+'\')"':'')+'>'+d+dot+'</div>';
  }
  document.getElementById("calGrid").innerHTML = g;
  // 月份切換鈕：只在有資料的月份之間移動
  const months = [...new Set(dates.map(d=>d.slice(0,7)))].sort();
  const idx = months.indexOf(viewYM);
  document.getElementById("prevM").disabled = idx<=0;
  document.getElementById("nextM").disabled = idx>=months.length-1;
}
function selectDay(ds){ selDate=ds; viewYM=ds.slice(0,7); renderCal(); renderDay(); }
document.getElementById("prevM").onclick = ()=>{ const ms=[...new Set(dates.map(d=>d.slice(0,7)))].sort(); const i=ms.indexOf(viewYM); if(i>0){viewYM=ms[i-1];renderCal();} };
document.getElementById("nextM").onclick = ()=>{ const ms=[...new Set(dates.map(d=>d.slice(0,7)))].sort(); const i=ms.indexOf(viewYM); if(i<ms.length-1){viewYM=ms[i+1];renderCal();} };

if(selDate){ renderCal(); renderDay(); }
else { document.getElementById("dayPanel").innerHTML='<div class="empty">尚無交易日誌資料</div>'; document.getElementById("calGrid").innerHTML=''; }
</script>
</body></html>
